name: Registry Conformance

on:
  pull_request:
    paths:
      - "README.md"
      - "REGISTRY-SCHEMA.md"
      - "REGISTRY-INDEX.md"
      - "registry-index.json"
      - "registry-index.schema.json"
      - "RECORD-TEMPLATE.md"
      - "CONTRIBUTING.md"
      - "GOVERNANCE.md"
      - "SECURITY.md"
      - "weekly-proof/**"
      - "scripts/validate_registry.py"
      - ".github/workflows/registry-conformance.yml"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "REGISTRY-SCHEMA.md"
      - "REGISTRY-INDEX.md"
      - "registry-index.json"
      - "registry-index.schema.json"
      - "RECORD-TEMPLATE.md"
      - "CONTRIBUTING.md"
      - "GOVERNANCE.md"
      - "SECURITY.md"
      - "weekly-proof/**"
      - "scripts/validate_registry.py"
      - ".github/workflows/registry-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-registry:
    name: Validate registry controls
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned validator dependency
        run: python -m pip install --disable-pip-version-check "jsonschema==4.23.0"

      - name: Run deterministic registry conformance checks
        run: python scripts/validate_registry.py
