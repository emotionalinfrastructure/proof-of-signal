# EII Registry Conformance Workflow v1.2
# Changes to any registry control, evidence record, validator, fixture, or test surface
# MUST enter this workflow before the repository state can be treated as CI-checked.
name: Registry Conformance

on:
  pull_request:
    paths:
      # Registry identity and public control surface
      - "README.md"
      - "REGISTRY-SCHEMA.md"
      - "REGISTRY-INDEX.md"
      - "registry-index.json"
      - "registry-index.schema.json"

      # Governance and record-control documents
      - "RECORD-TEMPLATE.md"
      - "CONTRIBUTING.md"
      - "GOVERNANCE.md"
      - "SECURITY.md"
      - "TEST-MATRIX.md"

      # Provenance evidence records
      - "weekly-proof/**"

      # Executable conformance implementation
      - "scripts/**"
      - "tests/**"

      # CI control plane
      - ".github/workflows/registry-conformance.yml"

  push:
    branches:
      - main
    paths:
      # Registry identity and public control surface
      - "README.md"
      - "REGISTRY-SCHEMA.md"
      - "REGISTRY-INDEX.md"
      - "registry-index.json"
      - "registry-index.schema.json"

      # Governance and record-control documents
      - "RECORD-TEMPLATE.md"
      - "CONTRIBUTING.md"
      - "GOVERNANCE.md"
      - "SECURITY.md"
      - "TEST-MATRIX.md"

      # Provenance evidence records
      - "weekly-proof/**"

      # Executable conformance implementation
      - "scripts/**"
      - "tests/**"

      # CI control plane
      - ".github/workflows/registry-conformance.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-registry:
    name: Validate registry controls
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned validator dependency
        run: python -m pip install --disable-pip-version-check "jsonschema==4.23.0"

      - name: Run deterministic registry conformance checks
        run: python scripts/validate_registry.py

      - name: Run fixture-driven fail-closed tests
        run: python -m unittest -v tests.test_registry_conformance
